# Least-connections gateway for the worker pools. Workers are discovered
# through Docker DNS, so `docker compose up -d --scale summary=6` takes
# effect without restarting the gateway (up to 16 workers per pool). A worker
# receives traffic only after /healthz answers, i.e. after its model loaded.
global
    log stdout format raw local0 notice
    maxconn 512

defaults
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client  600s
    timeout server  600s
    timeout check   3s
    timeout queue   600s
    retries 2
    option redispatch

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 5s

frontend summary_in
    bind *:8801
    default_backend summary_pool

frontend embedding_in
    bind *:8802
    default_backend embedding_pool

backend summary_pool
    balance leastconn
    option httpchk GET /healthz
    default-server inter 5s fall 2 rise 1 maxconn 1
    server-template w 1-16 summary:8000 check resolvers docker init-addr none

backend embedding_pool
    balance leastconn
    option httpchk GET /healthz
    default-server inter 5s fall 2 rise 1 maxconn 1
    server-template w 1-16 embedding:8000 check resolvers docker init-addr none
