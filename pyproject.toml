[project]
name = "indexedcode"
version = "1.0.0a1"
description = "Local repository indexing orchestrator"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "tree-sitter~=0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "pathspec>=0.12",
    "mcp>=1.3,<2",
    "watchfiles>=0.21",
    "textual>=0.89",
]

[project.urls]
Repository = "https://github.com/the-michael-albert/indexedcode"
Issues = "https://github.com/the-michael-albert/indexedcode/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
indexedcode = "indexedcode.cli:main"
indexedcode-mcp = "indexedcode.mcp:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
